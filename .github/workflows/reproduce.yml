name: tests-and-reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is migrating to a new image
    timeout-minutes: 30
    env:
      # pin BLAS/OpenMP threads so numerical results don't depend on runner core count
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: pip install -r requirements.lock

      - name: Statistical tests
        run: pytest -q

      - name: Keep committed results for comparison, then remove generated outputs
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp reports/results.json reports/validation.json reports/design.json "$RUNNER_TEMP/committed/"
          make clean && rm -f reports/report.md docs/decision_memo.md docs/preregistration.md

      - name: Run full pipeline (simulate -> design -> analyze -> validate -> report)
        run: make data design analyze validate report

      - name: Confirm outputs were regenerated
        run: |
          set -e
          for f in docs/preregistration.md docs/decision_memo.md reports/report.md \
                   reports/design.json reports/results.json reports/validation.json \
                   reports/experiment_funnel.csv reports/experiment_retention.csv \
                   reports/event_study.csv reports/uplift_quintiles.csv reports/ipw_balance.csv; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          test "$(ls reports/figures/*.png | wc -l)" -eq 10
          grep -q "Decision memo" docs/decision_memo.md
          grep -q "Validation against ground truth" reports/report.md
          python - <<'PY'
          import json
          v = json.load(open("reports/validation.json"))
          principled = [r for r in v["table"] if r["ci_covers_truth"] is not None
                        and "guardrail" not in r["method"]]
          missed = [f'{r["estimand"]} / {r["method"]}' for r in principled if not r["ci_covers_truth"]]
          print(f"{len(principled) - len(missed)}/{len(principled)} principled CIs cover the true effect")
          assert not missed, f"CIs missing ground truth: {missed}"
          PY

      - name: Dashboard and metric catalog against the regenerated outputs
        run: pytest -q tests/test_dashboard.py tests/test_metric_catalog.py

      - name: Compare regenerated numbers with committed versions
        run: |
          for f in design results validation; do
            python tools/compare_results.py "$RUNNER_TEMP/committed/$f.json" "reports/$f.json"
          done
          if git diff --quiet -- docs reports/report.md; then
            echo "::notice title=report.md::regenerated byte-for-byte identical to the committed version"
          else
            echo "Text differences in generated documents:"
            git diff --stat -- docs reports/report.md
            git diff -U0 -- docs reports/report.md | head -60
          fi

      - name: Upload regenerated report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regenerated-report
          path: |
            reports/
            docs/
